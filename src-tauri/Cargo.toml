[package]
name = "breezemusic-windows"
version = "1.0.0"
description = "BreezeMusic Windows Desktop Client (KuGou Concept Edition appid=3116)"
authors = ["reneryi7"]
license = "GPL-3.0"
edition = "2021"

[lib]
name = "breezemusic_windows_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
md-5 = "0.10"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
rsa = "0.9"
num-bigint = "0.4"
base64 = "0.22"
hex = "0.4"
flate2 = "1.0"
uuid = { version = "1.8", features = ["v4"] }
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
directories = "5.0"
thiserror = "1.0"
regex = "1.10"
once_cell = "1.19"
lofty = "0.25"
sha2 = "0.10"
zeroize = "1.8"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
opt-level = 3
